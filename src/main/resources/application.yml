spring:
  application:
    name: wheel-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - com.basebackend.observability.otel.config.OtelAutoConfiguration
      - com.basebackend.observability.otel.config.BridgeConfiguration
  cloud:
    compatibility-verifier:
      enabled: false

server:
  port: 8180

# JWT配置 (JWT_SECRET 环境变量必须配置，无默认值)
wheel:

  # 转盘配置
  wheel:
    max-daily-spins: 50
    min-spin-interval: 1000

  # AI内容审核配置
  ai-audit:
    enabled: ${AI_AUDIT_ENABLED:false}
    primary-provider: ${AI_AUDIT_PRIMARY_PROVIDER:aliyun}
    connect-timeout: 3000
    read-timeout: 6000
    max-retries: 2
    retry-delay-ms: 500
    # 阿里云内容安全配置
    aliyun:
      enabled: ${ALIYUN_AUDIT_ENABLED:false}
      access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
      region-id: ${ALIYUN_REGION_ID:cn-shanghai}
      endpoint: ${ALIYUN_AUDIT_ENDPOINT:green-cip.cn-shanghai.aliyuncs.com}
      text-scenes: antispam
      image-scenes: porn,terrorism,ad
    # 腾讯云天御配置
    tencent:
      enabled: ${TENCENT_AUDIT_ENABLED:false}
      secret-id: ${TENCENT_SECRET_ID:}
      secret-key: ${TENCENT_SECRET_KEY:}
      region: ${TENCENT_REGION:ap-guangzhou}
      endpoint: ${TENCENT_TMS_ENDPOINT:tms.tencentcloudapi.com}
      image-endpoint: ${TENCENT_IMS_ENDPOINT:ims.tencentcloudapi.com}

  # 数据库备份配置
  backup:
    enabled: ${BACKUP_ENABLED:true}
    daily-cron: ${BACKUP_DAILY_CRON:0 0 2 * * ?}
    weekly-cron: ${BACKUP_WEEKLY_CRON:0 0 3 ? * SUN}
    cleanup-cron: ${BACKUP_CLEANUP_CRON:0 0 4 * * ?}
    health-check-cron: ${BACKUP_HEALTH_CHECK_CRON:0 0 * * * ?}
    retention-days: ${BACKUP_RETENTION_DAYS:30}
    min-backup-count: ${BACKUP_MIN_COUNT:7}
    storage-path: ${BACKUP_STORAGE_PATH:/data/backups}
    encryption-enabled: ${BACKUP_ENCRYPTION_ENABLED:true}
    encryption-key: ${BACKUP_ENCRYPTION_KEY:}
    alert-threshold-hours: ${BACKUP_ALERT_THRESHOLD_HOURS:48}
    storage-warning-threshold-gb: ${BACKUP_STORAGE_WARNING_GB:50}
    mysql:
      mysqldump-path: ${MYSQLDUMP_PATH:mysqldump}
      mysql-path: ${MYSQL_PATH:mysql}
      host: ${MYSQL_HOST:localhost}
      port: ${MYSQL_PORT:3306}
      database: ${MYSQL_DATABASE:wheel}
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:}
      extra-args: ${MYSQLDUMP_EXTRA_ARGS:--single-transaction --quick --lock-tables=false}
    retry:
      max-retries: ${BACKUP_MAX_RETRIES:3}
      initial-delay-ms: ${BACKUP_INITIAL_DELAY_MS:1000}
      multiplier: ${BACKUP_RETRY_MULTIPLIER:2.0}
      max-delay-ms: ${BACKUP_MAX_DELAY_MS:30000}

push:
  jpush:
    enabled: ${JPUSH_ENABLED:false}
    app-key: ${JPUSH_APP_KEY:1d3cf04b74d8a8f293977c75}
    master-secret: ${JPUSH_MASTER_SECRET:f37674ebde9757958e00b691}
    title: ${JPUSH_TITLE:情侣转盘}
    apns-production: ${JPUSH_APNS_PRODUCTION:false}

