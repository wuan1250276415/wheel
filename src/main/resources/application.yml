spring:
  application:
    name: wheel-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - com.basebackend.observability.otel.config.OtelAutoConfiguration
      - com.basebackend.observability.otel.config.BridgeConfiguration
  cloud:
    compatibility-verifier:
      enabled: false

server:
  port: 8180

# JWT配置 (JWT_SECRET 环境变量必须配置，无默认值)
wheel:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-validity-in-seconds: 1800
    refresh-token-validity-in-seconds: 604800

  # 转盘配置
  wheel:
    max-daily-spins: 50
    min-spin-interval: 1000

