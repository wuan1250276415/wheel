spring:
  application:
    name: wheel-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - com.basebackend.observability.otel.config.OtelAutoConfiguration
      - com.basebackend.observability.otel.config.BridgeConfiguration
  cloud:
    compatibility-verifier:
      enabled: false

server:
  port: 8180

# JWT配置
wheel:
  jwt:
    secret: ${JWT_SECRET:mySecretKeyForWheelApi2025MustBeVeryLongToEnsureSecurityAndBeAtLeast512BitsLong}
    access-token-validity-in-seconds: 1800
    refresh-token-validity-in-seconds: 604800

  # 转盘配置
  wheel:
    max-daily-spins: 50
    min-spin-interval: 1000

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: NOT_NULL
      update-strategy: NOT_NULL
      select-strategy: NOT_EMPTY
  mapper-locations: classpath*:/mapper/**/*.xml

# Knife4j (Swagger) 配置
knife4j:
  enable: true
  setting:
    language: zh-CN
  basic:
    enable: false

# Logging Statistics Configuration
logging:
  statistics:
    enabled: true
    cache-size: 100
    cache-ttl: 1m
    realtime-window: 1m
    historical-window: 5m
    max-window: 10m
  level:
    com.basebackend.wheel: DEBUG
    org.springframework.security: DEBUG
