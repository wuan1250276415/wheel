spring:
  application:
    name: wheel-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - com.basebackend.observability.otel.config.OtelAutoConfiguration
      - com.basebackend.observability.otel.config.BridgeConfiguration
  cloud:
    compatibility-verifier:
      enabled: false

server:
  port: 8180

# JWT配置 (JWT_SECRET 环境变量必须配置，无默认值)
wheel:

  # 转盘配置
  wheel:
    max-daily-spins: 50
    min-spin-interval: 1000

  # AI内容审核配置
  ai-audit:
    enabled: ${AI_AUDIT_ENABLED:false}
    primary-provider: ${AI_AUDIT_PRIMARY_PROVIDER:aliyun}
    connect-timeout: 3000
    read-timeout: 6000
    max-retries: 2
    retry-delay-ms: 500
    # 阿里云内容安全配置
    aliyun:
      enabled: ${ALIYUN_AUDIT_ENABLED:false}
      access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
      region-id: ${ALIYUN_REGION_ID:cn-shanghai}
      endpoint: ${ALIYUN_AUDIT_ENDPOINT:green-cip.cn-shanghai.aliyuncs.com}
      text-scenes: antispam
      image-scenes: porn,terrorism,ad
    # 腾讯云天御配置
    tencent:
      enabled: ${TENCENT_AUDIT_ENABLED:false}
      secret-id: ${TENCENT_SECRET_ID:}
      secret-key: ${TENCENT_SECRET_KEY:}
      region: ${TENCENT_REGION:ap-guangzhou}
      endpoint: ${TENCENT_TMS_ENDPOINT:tms.tencentcloudapi.com}
      image-endpoint: ${TENCENT_IMS_ENDPOINT:ims.tencentcloudapi.com}

push:
  jpush:
    enabled: ${JPUSH_ENABLED:false}
    app-key: ${JPUSH_APP_KEY:1d3cf04b74d8a8f293977c75}
    master-secret: ${JPUSH_MASTER_SECRET:f37674ebde9757958e00b691}
    title: ${JPUSH_TITLE:情侣转盘}
    apns-production: ${JPUSH_APNS_PRODUCTION:false}

