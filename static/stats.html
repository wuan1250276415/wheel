<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计数据 - 爱的转盘</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #fff9fc 0%, #ffebf5 100%);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #ffb6d9;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.3);
        }

        .stat-emoji {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #ff69b4;
        }

        .player-stats {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #ffebf5;
            margin-bottom: 30px;
        }

        .player-stats h3 {
            color: #ff69b4;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #fff9fc;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .player-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .player-numbers {
            display: flex;
            gap: 20px;
        }

        .player-stat {
            text-align: center;
        }

        .player-stat-label {
            font-size: 0.8em;
            color: #999;
        }

        .player-stat-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #ff69b4;
        }

        .distribution {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #ffebf5;
            margin-bottom: 30px;
        }

        .distribution h3 {
            color: #ff69b4;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .dist-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .dist-label {
            flex: 0 0 150px;
            font-size: 1em;
        }

        .dist-bar-container {
            flex: 1;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin: 0 15px;
        }

        .dist-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff69b4 0%, #ff1493 100%);
            border-radius: 15px;
            transition: width 0.5s ease;
        }

        .dist-count {
            font-weight: bold;
            color: #ff69b4;
            min-width: 30px;
            text-align: right;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.4);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #ff69b4;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 统计数据</h1>
            <p class="subtitle">看看谁的运气更好</p>
        </header>

        <main id="mainContent">
            <div class="loading">加载中...</div>
        </main>

        <footer>
            <p>用爱制作 ❤️ 只属于我们的回忆</p>
        </footer>
    </div>

    <script>
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                renderStats(stats);
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('mainContent').innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">😢</div>
                        <p>加载失败,请刷新页面重试</p>
                    </div>
                `;
            }
        }

        function renderStats(stats) {
            const totalRewards = Object.values(stats.player_stats).reduce((sum, p) => sum + p.rewards, 0);
            const totalPunishments = Object.values(stats.player_stats).reduce((sum, p) => sum + p.punishments, 0);

            const html = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-emoji">🎯</div>
                        <div class="stat-label">总转盘次数</div>
                        <div class="stat-value">${stats.total_spins}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-emoji">🎁</div>
                        <div class="stat-label">获得奖励</div>
                        <div class="stat-value">${totalRewards}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-emoji">😱</div>
                        <div class="stat-label">受到惩罚</div>
                        <div class="stat-value">${totalPunishments}</div>
                    </div>
                </div>

                <div class="player-stats">
                    <h3>👫 玩家统计</h3>
                    ${Object.entries(stats.player_stats).map(([name, data]) => `
                        <div class="player-row">
                            <div class="player-name">${name === '老公' ? '🤵' : '👰'} ${name}</div>
                            <div class="player-numbers">
                                <div class="player-stat">
                                    <div class="player-stat-label">总次数</div>
                                    <div class="player-stat-value">${data.total}</div>
                                </div>
                                <div class="player-stat">
                                    <div class="player-stat-label">奖励</div>
                                    <div class="player-stat-value" style="color: #90ee90;">${data.rewards}</div>
                                </div>
                                <div class="player-stat">
                                    <div class="player-stat-label">惩罚</div>
                                    <div class="player-stat-value" style="color: #dda0dd;">${data.punishments}</div>
                                </div>
                                <div class="player-stat">
                                    <div class="player-stat-label">幸运值</div>
                                    <div class="player-stat-value">${data.total > 0 ? ((data.rewards / data.total) * 100).toFixed(0) : 0}%</div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div class="distribution">
                    <h3>📈 结果分布</h3>
                    ${Object.entries(stats.result_distribution)
                        .sort((a, b) => b[1] - a[1])
                        .map(([result, count]) => {
                            const percentage = (count / stats.total_spins) * 100;
                            return `
                                <div class="dist-item">
                                    <div class="dist-label">${result}</div>
                                    <div class="dist-bar-container">
                                        <div class="dist-bar" style="width: ${percentage}%"></div>
                                    </div>
                                    <div class="dist-count">${count}</div>
                                </div>
                            `;
                        }).join('')}
                </div>

                <div style="text-align: center;">
                    <a href="/" class="back-btn">← 返回转盘</a>
                </div>
            `;

            document.getElementById('mainContent').innerHTML = html;
        }

        loadStats();
    </script>
</body>
</html>
