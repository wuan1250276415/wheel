<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱的转盘 - 游戏惩罚与奖励</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💕 爱的转盘 💕</h1>
            <p class="subtitle">用爱与欢笑记录我们的每一刻</p>
        </header>

        <main>
            <!-- 玩家选择 -->
            <div class="player-selection">
                <button class="player-btn" data-player="老公" id="player1">
                    🤵 老公
                </button>
                <button class="player-btn" data-player="老婆" id="player2">
                    👰 老婆
                </button>
            </div>

            <div class="selected-player" id="selectedPlayer" style="display: none;">
                当前玩家: <span id="currentPlayer"></span>
            </div>

            <!-- 转盘容器 -->
            <div class="wheel-container">
                <div class="wheel-pointer">▼</div>
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
                <button class="spin-button" id="spinButton" disabled>
                    🎯 开始转盘
                </button>
            </div>

            <!-- 结果显示 -->
            <div class="result-display" id="resultDisplay" style="display: none;">
                <div class="result-content">
                    <div class="result-emoji" id="resultEmoji"></div>
                    <div class="result-text" id="resultText"></div>
                    <div class="result-type" id="resultType"></div>
                </div>
            </div>

            <!-- 功能按钮 -->
            <div class="action-buttons">
                <button class="action-btn" onclick="location.href='/static/history.html'">
                    📜 查看历史
                </button>
                <button class="action-btn" onclick="location.href='/static/stats.html'">
                    📊 统计数据
                </button>
            </div>
        </main>

        <footer>
            <p>用爱制作 ❤️ 只属于我们的回忆</p>
        </footer>
    </div>

    <script src="/static/wheel.js"></script>
</body>
</html>
